<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowButler - 로그인</title>
  <link rel="stylesheet" href="./style.css?v=20260601-ui2" />
</head>

<body class="login-body">
  <main class="login-shell">
    <div class="login-bg">
      <div class="brand-wrap">
        <div class="brand-logo">FLOWBUTLER</div>
      </div>

      <section class="login-card">
        <h1 class="login-title">FlowButler 로그인</h1>
        <p class="login-subtitle">물류 업무 자동화를 시작하세요.</p>

        <div class="form-group">
          <label for="email">이메일</label>
          <input type="email" id="email" placeholder="name@company.com" />
        </div>

        <div class="form-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" placeholder="비밀번호 입력" />
        </div>

        <div class="auth-actions">
          <button id="login-btn" class="primary-btn">로그인</button>
          <button id="move-signup-btn" class="secondary-btn">계정 만들기</button>
        </div>

        <div class="auth-helper">
          아직 계정이 없으신가요?
          <a href="/signup.html" class="inline-link">회원가입</a>
        </div>

        <div id="user-info" class="user-info">로그인 안 됨</div>
        <div id="status" class="status-box"></div>
      </section>
    </div>
  </main>

  <script type="module" src="./js/login.js"></script>
</body>

</html>
