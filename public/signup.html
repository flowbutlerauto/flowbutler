<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowButler - 회원가입</title>
    <link rel="stylesheet" href="./style.css?v=20260601-ui2" />
</head>

<body class="login-body">
    <main class="login-shell">
        <div class="login-bg">
            <div class="login-topbar">
                <a href="/login.html" class="back-link">로그인으로 돌아가기</a>
            </div>

            <div class="brand-wrap">
                <div class="brand-logo">FLOWBUTLER</div>
            </div>

            <section class="login-card">
                <h1 class="login-title">계정 만들기</h1>
                <p class="login-subtitle">
                    관리자 승인 후 워크스페이스를 사용할 수 있습니다.
                </p>

                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" placeholder="name@company.com" />
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" placeholder="비밀번호 입력" />
                </div>

                <div class="auth-note">
                    가입 요청은 무료 플랜으로 생성되며, 승인 전에는 대시보드 접근이 제한됩니다.
                </div>

                <div class="auth-actions">
                    <button id="signup-btn" class="primary-btn">회원가입 요청하기</button>
                    <button id="move-login-btn" class="secondary-btn">로그인</button>
                </div>

                <div class="auth-helper">
                    이미 계정이 있으신가요?
                    <a href="/login.html" class="inline-link">로그인</a>
                </div>

                <div id="status" class="status-box"></div>
            </section>
        </div>
    </main>

    <script type="module" src="./js/signup.js"></script>
</body>

</html>
